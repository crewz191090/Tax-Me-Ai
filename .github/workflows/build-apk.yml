name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew's executable bit can get lost when committed from Windows;
      # git now tracks it correctly, but set it defensively before anything
      # (npx cap sync included) might need to run it.
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest runners already ship a full Android SDK at
      # $ANDROID_SDK_ROOT/$ANDROID_HOME — no separate setup action needed
      # (and android-actions/setup-android@v3 currently hard-fails: it
      # requests the legacy "tools" package, which Google has removed).
      # Just make sure the exact platform/build-tools this project compiles
      # against are installed, in case the runner image hasn't caught up yet.
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-me-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
